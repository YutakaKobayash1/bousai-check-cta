name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        run: |
          php -l bousai-check-cta.php
          php -l includes/class-bcc-disaster-info-inline.php

      - name: RC5 slot-contract regression
        run: php tests/test-slot-contract.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/bcc.js
          node --check assets/js/bcc-disaster-info-inline.js