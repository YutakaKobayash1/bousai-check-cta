name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        run: |
          php -l bousai-check-cta.php
          php -l includes/class-bcc-disaster-info-inline.php

      - name: v1.4.2-rc1 architecture regression
        run: php tests/test-slot-contract.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/bcc.js
          node --check assets/js/bcc-disaster-info-inline.js
          node --check tests/test-lower-dom.js

      - name: v1.4.2-rc1 lower-placement DOM integration
        run: |
          npm install --no-save --no-package-lock jsdom@24.1.3
          node tests/test-lower-dom.js

      - name: Build v1.4.2-rc1 plugin ZIP
        run: |
          rm -rf dist
          mkdir -p dist/bousai-check-cta
          cp bousai-check-cta.php dist/bousai-check-cta/
          cp README.txt dist/bousai-check-cta/
          cp -R assets dist/bousai-check-cta/
          cp -R includes dist/bousai-check-cta/
          cat > dist/bousai-check-cta/BUILD-MANIFEST.txt <<EOF
          Bousai Check CTA v1.4.2-rc1
          Source commit: $GITHUB_SHA
          CI run: $GITHUB_RUN_ID
          Architecture: lower primary / CTA / SNS / About; weather retains original slot
          Required coordinated preview dependencies:
          - existing layout owner unchanged
          - SNS19 v1.4.7-rc1 lower placement candidate
          - weather22 placement-rc1 independent slot candidate
          EOF
          (
            cd dist
            zip -qr bousai-check-cta-1.4.2-rc1.zip bousai-check-cta
          )
          sha256sum dist/bousai-check-cta-1.4.2-rc1.zip

      - name: Upload v1.4.2-rc1 plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bousai-check-cta-1.4.2-rc1
          path: dist/bousai-check-cta-1.4.2-rc1.zip
          if-no-files-found: error
          retention-days: 30
